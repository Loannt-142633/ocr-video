<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Thử OCR phụ đề — Cơm</title>
<style>body{margin:0;background:#0b1423;color:#e8edf7;font:16px system-ui;padding:32px}main{max-width:1000px;margin:auto}.screen{height:380px;background:linear-gradient(135deg,#203f56,#090c13);position:relative;border-radius:16px;display:flex;align-items:center;justify-content:center}.scene{font-size:72px;opacity:.25}.subtitle{position:absolute;bottom:30px;left:20px;right:20px;text-align:center;font:bold 36px sans-serif;color:white;text-shadow:2px 2px 2px black,-2px -2px black}button{padding:12px;border:0;border-radius:8px;margin:14px 8px 0 0;cursor:pointer}p{color:#b4c4d7}</style></head>
<body><main><h1>Thử OCR phụ đề</h1><p>Chọn English trong extension, rồi kéo vùng bao quanh chữ trắng bên dưới.</p>
<div class="screen"><span class="scene">OCR</span><div class="subtitle" id="subtitle">Hello Com, subtitle OCR works!</div></div>
<button id="next">Câu tiếp theo</button><button id="auto">Tự đổi câu: Tắt</button><button id="blank">Ẩn/hiện chữ</button>
<p>Đây là chữ mô phỏng ghép vào hình. Bản OCR không cần backend hoặc API key.</p></main>
<script>const lines=['Hello Com, subtitle OCR works!','Where are you going tonight?','I will be back tomorrow.','Please wait for me.'];let i=0,timer=null;const sub=document.getElementById('subtitle');function next(){sub.style.visibility='visible';sub.textContent=lines[++i%lines.length]}document.getElementById('next').onclick=next;document.getElementById('auto').onclick=function(){if(timer){clearInterval(timer);timer=null}else timer=setInterval(next,6000);this.textContent='Tự đổi câu: '+(timer?'Bật':'Tắt')};document.getElementById('blank').onclick=()=>sub.style.visibility=sub.style.visibility==='hidden'?'visible':'hidden';</script></body></html>
